<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mindpop Akademi e-posta doğrulama</title>
  </head>
  <body style="margin:0;background:#fbfaff;color:#251f35;font-family:Arial,sans-serif">
    <main style="max-width:560px;margin:32px auto;padding:32px;background:#ffffff;border:1px solid #e3ddf2;border-radius:20px">
      <p style="margin:0 0 24px;font-size:24px;font-weight:700;color:#7b61ff">
        Mindpop Akademi
      </p>
      <h1 style="margin:0;font-size:28px;line-height:1.3">Öğrenme macerana hoş geldin!</h1>
      <p style="margin:20px 0 0;font-size:16px;line-height:1.6">
        Hesabını etkinleştirmek ve POP ile sana özel yol haritanı oluşturmaya başlamak için e-posta adresini doğrulaman gerekiyor.
      </p>
      <p style="margin:28px 0">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;background:#7b61ff;border-radius:999px;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none">
          E-posta adresimi doğrula
        </a>
      </p>
      <p style="margin:0;font-size:14px;line-height:1.6;color:#6f687a">
        Bu hesabı sen oluşturmadıysan bu e-postayı güvenle görmezden gelebilirsin.
      </p>
    </main>
  </body>
</html>
